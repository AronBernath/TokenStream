name: Publish Images

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev-ui
            dockerfile: services/dev-ui/Dockerfile
            image: dev-ui
          - name: orchestrator-api
            dockerfile: services/orchestrator_api/Dockerfile
            image: orchestrator-api
          - name: retrieval-api
            dockerfile: services/retrieval_api/Dockerfile
            target: runtime
            image: retrieval-api
          - name: ingestion-worker
            dockerfile: services/ingestion_worker/Dockerfile
            image: ingestion-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${REGISTRY}/${owner}/tokenstream/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=TokenStream ${{ matrix.name }}
            org.opencontainers.image.description=TokenStream service image for ${{ matrix.name }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
