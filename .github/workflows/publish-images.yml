name: Publish Images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish or backfill, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev-ui
            dockerfile: services/dev-ui/Dockerfile
            image: dev-ui
          - name: orchestrator-api
            dockerfile: services/orchestrator_api/Dockerfile
            image: orchestrator-api
          - name: retrieval-api
            dockerfile: services/retrieval_api/Dockerfile
            target: runtime
            image: retrieval-api
          - name: ingestion-worker
            dockerfile: services/ingestion_worker/Dockerfile
            image: ingestion-worker

    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_RELEASE_TAG}"
          if [ -z "$tag" ]; then
            echo "Release tag is required" >&2
            exit 1
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "Release tag must look like v0.1.1" >&2
              exit 1
              ;;
          esac

          gh release view "$tag" >/dev/null
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          commit="$(git rev-list -n 1 "$tag")"
          short_commit="${commit:0:7}"
          stable="true"
          if [[ "$tag" == *"-"* ]]; then
            stable="false"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="${REGISTRY}/${owner}/tokenstream/${{ matrix.image }}"
          echo "IMAGE_NAME=${image_name}" >> "$GITHUB_ENV"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release provenance evidence directory
        run: mkdir -p "evidence/release/${{ matrix.image }}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=sha-${{ steps.release.outputs.short_commit }}
          labels: |
            org.opencontainers.image.title=TokenStream ${{ matrix.name }}
            org.opencontainers.image.description=TokenStream service image for ${{ matrix.name }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: release-source
          file: release-source/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Generate image build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image digest with Cosign keyless
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Write release image digest evidence
        shell: bash
        run: |
          set -euo pipefail
          python tests/ci/build_release_image_digest_inventory.py entry \
            --service-name "${{ matrix.image }}" \
            --image-name "${{ steps.image.outputs.name }}" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --output "evidence/release/${{ matrix.image }}/release-image-digest.${{ matrix.image }}.json"

      - name: Write release provenance subject evidence
        shell: bash
        run: |
          set -euo pipefail
          python tests/ci/build_release_image_provenance_subject.py \
            --service-name "${{ matrix.image }}" \
            --image-name "${{ steps.image.outputs.name }}" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --attestation-action "actions/attest@v4" \
            --output "evidence/release/${{ matrix.image }}/release-image-provenance-subject.${{ matrix.image }}.json"

      - name: Write release image signature evidence
        shell: bash
        run: |
          set -euo pipefail
          python tests/ci/build_release_image_signature_inventory.py entry \
            --service-name "${{ matrix.image }}" \
            --image-name "${{ steps.image.outputs.name }}" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --signature-tool "cosign" \
            --signature-mode "keyless" \
            --output "evidence/release/${{ matrix.image }}/release-image-signature.${{ matrix.image }}.json"

      - name: Upload release provenance subject evidence
        uses: actions/upload-artifact@v5
        with:
          name: release-image-provenance-subject-${{ matrix.image }}
          path: evidence/release/${{ matrix.image }}/release-image-provenance-subject.${{ matrix.image }}.json
          if-no-files-found: error

      - name: Upload release image digest evidence
        uses: actions/upload-artifact@v5
        with:
          name: release-image-digest-${{ matrix.image }}
          path: evidence/release/${{ matrix.image }}/release-image-digest.${{ matrix.image }}.json
          if-no-files-found: error

      - name: Upload release image signature evidence
        uses: actions/upload-artifact@v5
        with:
          name: release-image-signature-${{ matrix.image }}
          path: evidence/release/${{ matrix.image }}/release-image-signature.${{ matrix.image }}.json
          if-no-files-found: error

  release-image-digests:
    name: Publish release image digest inventory
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release image digest evidence
        uses: actions/download-artifact@v5
        with:
          pattern: release-image-digest-*
          path: evidence/release/digest-inputs

      - name: Build aggregate release image digest inventory
        run: |
          set -euo pipefail
          python tests/ci/build_release_image_digest_inventory.py aggregate \
            --input-dir evidence/release/digest-inputs \
            --output evidence/release/release-image-digests.json

      - name: Upload release image digest inventory evidence
        uses: actions/upload-artifact@v5
        with:
          name: release-image-digests
          path: evidence/release/release-image-digests.json
          if-no-files-found: error

      - name: Attach release image digest inventory to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(
            python -c "import json, pathlib; print(json.loads(pathlib.Path('evidence/release/release-image-digests.json').read_text(encoding='utf-8'))['release'])"
          )"
          gh release upload "$tag" evidence/release/release-image-digests.json --clobber

  release-image-signatures:
    name: Publish release image signature inventory
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release image signature evidence
        uses: actions/download-artifact@v5
        with:
          pattern: release-image-signature-*
          path: evidence/release/signature-inputs

      - name: Build aggregate release image signature inventory
        run: |
          set -euo pipefail
          python tests/ci/build_release_image_signature_inventory.py aggregate \
            --input-dir evidence/release/signature-inputs \
            --output evidence/release/release-image-signatures.json

      - name: Upload release image signature inventory evidence
        uses: actions/upload-artifact@v5
        with:
          name: release-image-signatures
          path: evidence/release/release-image-signatures.json
          if-no-files-found: error

      - name: Attach release image signature inventory to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(
            python -c "import json, pathlib; print(json.loads(pathlib.Path('evidence/release/release-image-signatures.json').read_text(encoding='utf-8'))['release'])"
          )"
          gh release upload "$tag" evidence/release/release-image-signatures.json --clobber
