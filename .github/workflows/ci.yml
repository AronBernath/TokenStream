name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Mintlify navigation
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("docs")
          config_path = root / "docs.json"
          if not config_path.exists():
              sys.exit("docs/docs.json is missing")

          with config_path.open(encoding="utf-8") as handle:
              config = json.load(handle)

          required = ["name", "theme", "colors", "navigation"]
          missing_required = [field for field in required if field not in config]
          if missing_required:
              sys.exit(f"docs.json missing required field(s): {', '.join(missing_required)}")

          colors = config.get("colors") or {}
          if not colors.get("primary"):
              sys.exit("docs.json must define colors.primary")

          groups = (config.get("navigation") or {}).get("groups") or []
          pages = []
          for group in groups:
              pages.extend(group.get("pages") or [])

          if not pages:
              sys.exit("docs.json navigation has no pages")

          missing_pages = [page for page in pages if not (root / f"{page}.mdx").exists()]
          if missing_pages:
              sys.exit("docs.json references missing page(s): " + ", ".join(missing_pages))

          forbidden = [
              "Generated content was removed",
              "planning or review artifacts",
              "Re-run generation",
          ]
          docs_files = [root / f"{page}.mdx" for page in pages]
          bad_markers = []
          for file_path in docs_files:
              text = file_path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      bad_markers.append(f"{file_path}: {marker}")

          if bad_markers:
              sys.exit("Mintlify docs contain cleanup placeholder text:\n" + "\n".join(bad_markers))

          print(f"Validated {len(pages)} Mintlify page(s)")
          PY

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            -r services/orchestrator_api/requirements.txt \
            -r services/retrieval_api/requirements.txt \
            -r services/ingestion_worker/requirements.txt \
            -r services/dev-ui/requirements.txt

      - name: Lint Python
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test common, ingestion, retrieval, and admin packages
        env:
          PYTHONPATH: services/common:services/ingestion_worker:services/retrieval_api
        run: |
          python -m pytest -m "not integration" \
            tests \
            packages/config_auth/tests \
            services/ingestion_worker/tests \
            services/dev-ui/tests \
            services/retrieval_api/tests

      - name: Test orchestrator API
        env:
          PYTHONPATH: services/common:services/orchestrator_api
        run: |
          python -m pytest -m "not integration" services/orchestrator_api/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dev-ui/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dev-ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build retrieval API
        run: docker build -f services/retrieval_api/Dockerfile --target runtime -t tokenstream/retrieval-api:ci .

      - name: Build ingestion worker
        run: docker build -f services/ingestion_worker/Dockerfile -t tokenstream/ingestion-worker:ci .

      - name: Build orchestrator API
        run: docker build -f services/orchestrator_api/Dockerfile -t tokenstream/orchestrator-api:ci .

      - name: Build dev UI
        run: docker build -f services/dev-ui/Dockerfile -t tokenstream/dev-ui:ci .
