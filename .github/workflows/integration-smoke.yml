          python tests/ci/dast_auth_management_probe.py \
            --output evidence/dast/dast-authenticated-management-boundary.json \
            --fail-on-setup-failure \
            --fail-on-status-mismatch \
            --fail-on-validator-failure \
            --fail-on-auth-boundary-bypass \
            --fail-on-leakage \
            --fail-on-unhandled-error

      - name: Build authenticated management DAST summary and policy evidence
        run: |
          set -euo pipefail
          python tests/ci/build_zap_summary.py \
            --probe-report evidence/dast/dast-authenticated-management-boundary.json \
            --scanner tokenstream-authenticated-dast-probes \
            --mode authenticated-layer-2b-management \
            --policy-mode authenticated-layer-2b-management-permissive \
            --probe-key authenticated_management_probe \
            --policy-description "Generate authenticated Layer 2B management behavior evidence without blocking on accepted known gaps." \
            --summary-output evidence/dast/dast-authenticated-management-summary.json \
            --policy-output evidence/dast/dast-authenticated-management-policy-evaluation.json

      - name: Upload authenticated management DAST evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dast-authenticated-layer-2b-management-evidence
          path: |
            evidence/dast/dast-authenticated-management-boundary.json
            evidence/dast/dast-authenticated-management-summary.json
            evidence/dast/dast-authenticated-management-policy-evaluation.json
          if-no-files-found: error

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=200 \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans
