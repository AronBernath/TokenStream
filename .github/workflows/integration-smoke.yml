name: Integration and Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/integration-smoke.yml"
      - "docker-compose.ci.yml"
      - "docker-compose.yaml"
      - "packages/config_auth/**"
      - "requirements-dev.txt"
      - "services/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/integration-smoke.yml"
      - "docker-compose.ci.yml"
      - "docker-compose.yaml"
      - "packages/config_auth/**"
      - "requirements-dev.txt"
      - "services/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  integration-python:
    name: Python Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            -r services/retrieval_api/requirements.txt \
            -r services/ingestion_worker/requirements.txt

      - name: Run integration-focused tests
        env:
          EMBEDDER_URL: http://mock-embedder.invalid
          PYTHONPATH: services/common:services/ingestion_worker:services/retrieval_api
          QDRANT_URL: http://qdrant.invalid:6333
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_graph_retrieval.py \
            tests/test_pdf_parser_service.py \
            services/ingestion_worker/tests/test_pdf_parser_integration.py

  docker-build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev-ui
            dockerfile: services/dev-ui/Dockerfile
            image: dev-ui
          - name: ingestion-worker
            dockerfile: services/ingestion_worker/Dockerfile
            image: ingestion-worker
          - name: orchestrator-api
            dockerfile: services/orchestrator_api/Dockerfile
            image: orchestrator-api
          - name: retrieval-api
            dockerfile: services/retrieval_api/Dockerfile
            target: runtime
            image: retrieval-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve image name
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/tokenstream/${{ matrix.image }}:ci-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke-compose:
    name: Compose Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve GHCR owner
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare default orchestrator API key registry
        run: |
          set -euo pipefail
          mkdir -p evidence/authz
          printf '[]\n' > evidence/authz/orchestrator_api_keys.json

      - name: Build and start CI stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml build retrieval-api ingestion-worker orchestrator-api dev-ui
          docker compose -f docker-compose.ci.yml up -d \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui
          docker compose -f docker-compose.ci.yml ps

      - name: Run smoke assertions
        env:
          ORCHESTRATOR_API_KEY: ci-orchestrator-key
        run: |
          set -euo pipefail
          python tests/ci/smoke.py

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=200 \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  authz-matrix-compose:
    name: Authz Matrix Compose
    runs-on: ubuntu-24.04
    needs:
      - integration-python
      - docker-build
      - smoke-compose
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve GHCR owner
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare authz evidence directory
        run: |
          set -euo pipefail
          mkdir -p evidence/authz

      - name: Generate scoped orchestrator API key registry
        env:
          ORCHESTRATOR_MODELS_TOKEN: ${{ secrets.ORCHESTRATOR_MODELS_TOKEN }}
          ORCHESTRATOR_CHAT_TOKEN: ${{ secrets.ORCHESTRATOR_CHAT_TOKEN }}
          ORCHESTRATOR_RAG_TOKEN: ${{ secrets.ORCHESTRATOR_RAG_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          specs = [
              ("ORCHESTRATOR_MODELS_TOKEN", "ci-models-reader", ["models:list"]),
              ("ORCHESTRATOR_CHAT_TOKEN", "ci-chat-client", ["chat:invoke"]),
              ("ORCHESTRATOR_RAG_TOKEN", "ci-rag-client", ["rag:query"]),
          ]
          missing = [env_name for env_name, _, _ in specs if not os.environ.get(env_name)]
          if missing:
              sys.exit("Missing required CI secret(s): " + ", ".join(missing))

          payload = []
          for env_name, key_id, scopes in specs:
              token = os.environ[env_name]
              payload.append(
                  {
                      "key_id": key_id,
                      "key_hash": hashlib.sha256(token.encode("utf-8")).hexdigest(),
                      "subject": key_id,
                      "scopes": scopes,
                  }
              )

          output = pathlib.Path("evidence/authz/orchestrator_api_keys.json")
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          echo "ORCHESTRATOR_API_KEYS_FILE=$PWD/evidence/authz/orchestrator_api_keys.json" >> "$GITHUB_ENV"

      - name: Build and start CI stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml build retrieval-api ingestion-worker orchestrator-api dev-ui
          docker compose -f docker-compose.ci.yml up -d \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui
          docker compose -f docker-compose.ci.yml ps

      - name: Run smoke readiness and seed checks
        env:
          ORCHESTRATOR_API_KEY: ci-orchestrator-key
        run: |
          set -euo pipefail
          python tests/ci/smoke.py

      - name: Run live authorization matrix
        env:
          ORCHESTRATOR_MODELS_TOKEN: ${{ secrets.ORCHESTRATOR_MODELS_TOKEN }}
          ORCHESTRATOR_CHAT_TOKEN: ${{ secrets.ORCHESTRATOR_CHAT_TOKEN }}
          ORCHESTRATOR_RAG_TOKEN: ${{ secrets.ORCHESTRATOR_RAG_TOKEN }}
          ORCHESTRATOR_API_KEY: ci-orchestrator-key
        run: |
          set -euo pipefail
          python tests/ci/authz_matrix.py \
            --output evidence/authz/authz-matrix-report.json \
            --fail-on-mismatch

      - name: Upload authz matrix evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: authz-matrix-evidence
          path: evidence/authz/authz-matrix-report.json
          if-no-files-found: error

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=200 \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  dast-zap-unauthenticated:
    name: DAST ZAP Unauthenticated Baseline
    runs-on: ubuntu-24.04
    needs:
      - integration-python
      - docker-build
      - smoke-compose
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve GHCR owner
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare default orchestrator API key registry
        run: |
          set -euo pipefail
          mkdir -p evidence/authz
          printf '[]\n' > evidence/authz/orchestrator_api_keys.json

      - name: Prepare DAST evidence directory
        run: |
          set -euo pipefail
          mkdir -p evidence/dast
          chmod 777 evidence/dast

      - name: Build and start CI stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml build retrieval-api ingestion-worker orchestrator-api dev-ui
          docker compose -f docker-compose.ci.yml up -d \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui
          docker compose -f docker-compose.ci.yml ps

      - name: Run smoke readiness and seed checks
        env:
          ORCHESTRATOR_API_KEY: ci-orchestrator-key
        run: |
          set -euo pipefail
          python tests/ci/smoke.py

      - name: Run unauthenticated DAST boundary probes
        run: |
          set -euo pipefail
          python tests/ci/dast_unauth_probe.py \
            --output evidence/dast/dast-unauthenticated-boundary.json \
            --fail-on-public-unavailable \
            --fail-on-auth-bypass \
            --fail-on-mock-exposure

      - name: Run ZAP baseline scan for dev-ui
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/evidence/dast:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py \
              -t http://127.0.0.1:8010/ \
              -I \
              -m 2 \
              -T 10 \
              -j \
              --client-spider \
              -J zap-dev-ui-baseline.json \
              -w zap-dev-ui-baseline.md \
              -r zap-dev-ui-baseline.html

      - name: Run ZAP safe API scans
        run: |
          set -euo pipefail

          docker run --rm --network host \
            -v "$PWD/evidence/dast:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
              -t http://127.0.0.1:8004/v1/openapi.json \
              -f openapi \
              -S \
              -I \
              -T 10 \
              -J zap-orchestrator-api.json \
              -w zap-orchestrator-api.md \
              -r zap-orchestrator-api.html

          docker run --rm --network host \
            -v "$PWD/evidence/dast:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
              -t http://127.0.0.1:8000/openapi.json \
              -f openapi \
              -S \
              -I \
              -T 10 \
              -J zap-retrieval-api.json \
              -w zap-retrieval-api.md \
              -r zap-retrieval-api.html

          docker run --rm --network host \
            -v "$PWD/evidence/dast:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
              -t http://127.0.0.1:8002/openapi.json \
              -f openapi \
              -S \
              -I \
              -T 10 \
              -J zap-ingestion-worker-api.json \
              -w zap-ingestion-worker-api.md \
              -r zap-ingestion-worker-api.html

          docker run --rm --network host \
            -v "$PWD/evidence/dast:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-api-scan.py \
              -t http://127.0.0.1:8010/openapi.json \
              -f openapi \
              -S \
              -I \
              -T 10 \
              -J zap-management-api.json \
              -w zap-management-api.md \
              -r zap-management-api.html

      - name: Build DAST summary and policy evidence
        run: |
          set -euo pipefail
          python tests/ci/build_zap_summary.py \
            --probe-report evidence/dast/dast-unauthenticated-boundary.json \
            --zap-report evidence/dast/zap-dev-ui-baseline.json \
            --zap-report evidence/dast/zap-orchestrator-api.json \
            --zap-report evidence/dast/zap-retrieval-api.json \
            --zap-report evidence/dast/zap-ingestion-worker-api.json \
            --zap-report evidence/dast/zap-management-api.json \
            --summary-output evidence/dast/zap-dast-summary.json \
            --policy-output evidence/dast/zap-dast-policy-evaluation.json

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dast-zap-unauthenticated-evidence
          path: |
            evidence/dast/dast-unauthenticated-boundary.json
            evidence/dast/zap-*.json
            evidence/dast/zap-*.md
            evidence/dast/zap-*.html
          if-no-files-found: error

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=200 \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  dast-zap-authenticated-layer-2a:
    name: DAST ZAP Authenticated Layer 2A
    runs-on: ubuntu-24.04
    needs:
      - integration-python
      - docker-build
      - smoke-compose
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve GHCR owner
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare Layer 2A evidence directories
        run: |
          set -euo pipefail
          mkdir -p evidence/authz evidence/dast
          chmod 777 evidence/dast

      - name: Generate Layer 2A low-privilege orchestrator key registry
        env:
          ORCHESTRATOR_DAST_TOKEN: ${{ secrets.ORCHESTRATOR_DAST_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          token = os.environ.get("ORCHESTRATOR_DAST_TOKEN", "")
          if not token:
              sys.exit("Missing required CI secret: ORCHESTRATOR_DAST_TOKEN")

          payload = [
              {
                  "key_id": "ci-layer2a-dast",
                  "key_hash": hashlib.sha256(token.encode("utf-8")).hexdigest(),
                  "subject": "ci-layer2a-dast",
                  "scopes": ["models:list", "chat:invoke", "rag:query"],
                  "default_pipeline_id": "ci",
                  "allowed_providers": ["ci-mock"],
                  "allowed_models": ["ci-mock-model"],
                  "max_input_tokens": 2048,
                  "max_output_tokens": 64,
                  "max_total_tokens": 4096,
                  "max_top_k": 2,
              }
          ]

          output = pathlib.Path("evidence/authz/orchestrator_api_keys.json")
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          echo "ORCHESTRATOR_API_KEYS_FILE=$PWD/evidence/authz/orchestrator_api_keys.json" >> "$GITHUB_ENV"

      - name: Build and start CI stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml build retrieval-api ingestion-worker orchestrator-api dev-ui
          docker compose -f docker-compose.ci.yml up -d \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui
          docker compose -f docker-compose.ci.yml ps

      - name: Run smoke readiness and seed checks
        env:
          ORCHESTRATOR_API_KEY: ci-orchestrator-key
        run: |
          set -euo pipefail
          python tests/ci/smoke.py

      - name: Run authenticated Layer 2A orchestrator probes
        env:
          ORCHESTRATOR_DAST_TOKEN: ${{ secrets.ORCHESTRATOR_DAST_TOKEN }}
        run: |
          set -euo pipefail
          python tests/ci/dast_auth_orchestrator_probe.py \
            --output evidence/dast/dast-authenticated-orchestrator-boundary.json \
            --fail-on-token-missing \
            --fail-on-status-mismatch \
            --fail-on-validator-failure \
            --fail-on-policy-bypass \
            --fail-on-leakage

      - name: Run authenticated ZAP API scan for orchestrator
        env:
          ORCHESTRATOR_DAST_TOKEN: ${{ secrets.ORCHESTRATOR_DAST_TOKEN }}
        run: |
          set -euo pipefail
          cp tests/ci/zap_auth_header_hook.py evidence/dast/zap_auth_header_hook.py
          docker run --rm --network host \
            -e ZAP_AUTH_TOKEN="$ORCHESTRATOR_DAST_TOKEN" \
            -e ZAP_AUTH_TARGET_BASE_URL="http://127.0.0.1:8004" \
            -e ZAP_AUTH_COVERAGE_OUTPUT="/zap/wrk/zap-orchestrator-authenticated-coverage.json" \
            -v "$PWD/evidence/dast:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            /bin/sh -c 'zap-api-scan.py \
              -t http://127.0.0.1:8004/v1/openapi.json \
              -f openapi \
              -S \
              -I \
              -T 10 \
              -J zap-orchestrator-authenticated-api.json \
              -w zap-orchestrator-authenticated-api.md \
              -r zap-orchestrator-authenticated-api.html \
              --hook /zap/wrk/zap_auth_header_hook.py'

      - name: Assert authenticated ZAP coverage
        run: |
          set -euo pipefail
          python tests/ci/assert_zap_authenticated_coverage.py \
            --coverage-report evidence/dast/zap-orchestrator-authenticated-coverage.json \
            --require-all-protected-authenticated \
            --require-any-2xx

      - name: Build authenticated DAST summary and policy evidence
        run: |
          set -euo pipefail
          python tests/ci/build_zap_summary.py \
            --probe-report evidence/dast/dast-authenticated-orchestrator-boundary.json \
            --zap-report evidence/dast/zap-orchestrator-authenticated-api.json \
            --mode authenticated-layer-2a-orchestrator \
            --policy-mode authenticated-layer-2a-permissive \
            --probe-key authenticated_probe \
            --policy-description "Generate low-privilege authenticated OWASP ZAP Layer 2A evidence without blocking on alerts." \
            --summary-output evidence/dast/zap-authenticated-dast-summary.json \
            --policy-output evidence/dast/zap-authenticated-dast-policy-evaluation.json

      - name: Upload authenticated DAST evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dast-zap-authenticated-layer-2a-evidence
          path: |
            evidence/dast/dast-authenticated-orchestrator-boundary.json
            evidence/dast/zap-orchestrator-authenticated-api.json
            evidence/dast/zap-orchestrator-authenticated-api.md
            evidence/dast/zap-orchestrator-authenticated-api.html
            evidence/dast/zap-orchestrator-authenticated-coverage.json
            evidence/dast/zap-authenticated-dast-summary.json
            evidence/dast/zap-authenticated-dast-policy-evaluation.json
          if-no-files-found: error

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color --tail=200 \
            mock-provider \
            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  dast-authenticated-layer-2b-management:
    name: DAST Authenticated Layer 2B Management
    runs-on: ubuntu-24.04
    needs:
      - integration-python
      - docker-build
      - smoke-compose
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve GHCR owner
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare Layer 2B evidence directories
        run: |
