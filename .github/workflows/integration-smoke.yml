            mock-embedder \
            mock-registry \
            qdrant \
            retrieval-api \
            ingestion-worker \
            orchestrator-api \
            dev-ui
          docker compose -f docker-compose.ci.yml ps

      - name: Run smoke readiness and seed checks
        env:
          ORCHESTRATOR_API_KEY: ci-orchestrator-key
        run: |
          set -euo pipefail
          python tests/ci/smoke.py

      - name: Run authenticated Layer 2B management probes
        run: |
